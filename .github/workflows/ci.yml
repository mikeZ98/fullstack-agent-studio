# Continuous integration. Every push to main and every pull request into main must pass the
# same gates as `pnpm verify` locally, then build and smoke-test the production container.
#
# Actions are pinned to full commit SHAs (the release tag is noted alongside); bump both
# together. Tool versions come from the repository: Node.js from .nvmrc, pnpm from
# package.json "packageManager".
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per branch or pull request: a newer push cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: the pipeline only reads the repository and needs no secrets.
permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify (attribution, lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The attribution audit walks every commit; a shallow clone is refused.
          fetch-depth: 0
          persist-credentials: false

      - name: Audit commit attribution
        env:
          # A pull request is checked out as a merge commit that GitHub itself authored, so
          # audit the PR head and its history; on pushes, the pushed commit and its history.
          AUDIT_REV: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/audit-attribution.sh "$AUDIT_REV"

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test with coverage thresholds
        run: pnpm test

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts', 'tsconfig.json', 'postcss.config.mjs') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Production build (standalone)
        env:
          # Non-routable placeholders that satisfy build-time env validation. Server values
          # are read at runtime; no secret is needed to build.
          BACKEND_SSE_URL: http://agent.invalid/v1/stream
          NEXT_PUBLIC_API_URL: http://localhost:3000/api
        run: pnpm build

      - name: Check the standalone bundle
        run: test -f .next/standalone/server.js

  docker:
    name: Docker (build and smoke test)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the runner image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: runner
          tags: fullstack-agent-studio:local
          load: true
          push: false
          cache-from: type=gha,scope=studio-runner
          cache-to: type=gha,mode=max,scope=studio-runner

      - name: Smoke test the container (offline compose profile)
        env:
          # Reuse the image built above instead of building it again.
          SMOKE_SKIP_BUILD: "1"
        run: bash scripts/docker-smoke.sh
